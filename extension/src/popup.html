<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="hdr">
      <h1>Claude KB Capture</h1>
      <!-- The studio donate heart. Same glyph, same red and same button geometry
           as ArrDeck's SponsorHeart (src/app/components/SponsorHeart.tsx), so the
           signal reads identically across GrimnirWorks surfaces. The SVG is the
           lucide "heart" path, inlined - the popup has no icon font, loads no
           external asset and makes no network request. -->
      <button id="support-heart" type="button"
              aria-label="Support GrimnirWorks" title="Support GrimnirWorks">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16"
             viewBox="0 0 24 24" fill="#e5484d" stroke="#e5484d" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path>
        </svg>
      </button>
    </div>

    <div id="host" class="host">checking the native host...</div>

    <div class="row">
      <button id="ingest" disabled>Capture + Ingest</button>
      <button id="save" class="secondary" disabled>Capture only</button>
    </div>

    <div class="row">
      <button id="load" class="secondary" disabled>Load chat list</button>
    </div>

    <div id="listwrap" class="hidden">
      <div class="listbar">
        <span id="counts"></span>
        <span class="spacer"></span>
        <a href="#" id="selnew">select new</a>
        <a href="#" id="selnone">none</a>
      </div>
      <div id="list" class="list"></div>
      <div id="capnote" class="capnote hidden"></div>
      <div class="row">
        <button id="capsel" disabled>Capture + Ingest</button>
        <button id="capselsave" class="secondary" disabled>Capture only</button>
      </div>
    </div>

    <div id="out" class="out hidden"></div>

    <p class="foot">
      Captures the conversation in the active tab through claude.ai's own API.
      Held-back and refused captures are reported as such, never as successes.
    </p>

    <!-- capture-core FIRST: popup.js calls annotateRows() from it. The popup
         and the content script are separate JavaScript worlds, so a file the
         manifest injects into the page is NOT available here - it has to be
         loaded again, explicitly. -->
    <script src="capture-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
